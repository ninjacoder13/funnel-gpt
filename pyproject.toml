[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "funnel-gpt"
version = "0.1.0"
description = "Zero-PII product conversion funnel debugger powered by a from-scratch PyTorch GPT model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "torch>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
funnel-debug = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
